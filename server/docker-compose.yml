services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aiguard
      POSTGRES_USER: aiguard
      # Set POSTGRES_PASSWORD in .env before exposing this stack.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aiguard_dev}
    ports: ["5432:5432"]
    volumes: ["license-postgres:/var/lib/postgresql/data"]
  license-api:
    build: .
    environment:
      DATABASE_URL: postgres://aiguard:${POSTGRES_PASSWORD:-aiguard_dev}@postgres:5432/aiguard
      LICENSE_KEY_ID: default
      LICENSE_SIGNING_SEED_BASE64: ${LICENSE_SIGNING_SEED_BASE64}
      LISTEN_ADDR: 0.0.0.0:18765
    depends_on: [postgres]
    ports: ["18765:18765"]
volumes:
  license-postgres:
