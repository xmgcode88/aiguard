<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AIGuard 管理后台</title>
<style>
:root{font:14px Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#182230;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#eef3ff,#f7f8fb)}.login-card{width:390px;background:#fff;border:1px solid #e4e9f2;border-radius:20px;padding:34px;box-shadow:0 20px 60px #1d315d18}.logo{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:750;margin-bottom:8px}.logo-mark{width:34px;height:34px;border-radius:10px;background:#2d5bdb;color:white;display:grid;place-items:center}.muted{color:#748197}.field{display:grid;gap:7px;margin:15px 0}.field input,.field select{width:100%;height:42px;padding:0 12px;border:1px solid #dce2ec;border-radius:9px;font:inherit}.primary{height:42px;width:100%;border:0;border-radius:9px;background:#2859d7;color:white;font-weight:650;cursor:pointer}.error{color:#c3364b;background:#fff0f2;padding:10px;border-radius:8px}.shell{min-height:100vh;display:flex}.side{width:230px;background:#172238;color:#d8e1f2;padding:24px 14px}.side .logo{color:#fff;padding:0 12px 28px}.nav{width:100%;text-align:left;border:0;background:transparent;color:#aebbd0;padding:12px;border-radius:8px;font:inherit;cursor:pointer}.nav.active,.nav:hover{background:#2b4169;color:#fff}.main{flex:1;min-width:0}.topbar{height:76px;background:#fff;border-bottom:1px solid #e8ecf2;display:flex;justify-content:space-between;align-items:center;padding:0 34px}.topbar h1{font-size:22px;margin:0}.logout{border:1px solid #dce2ec;background:white;border-radius:8px;padding:9px 14px;cursor:pointer}.content{padding:28px 34px;max-width:1400px}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}.stat{background:white;border:1px solid #e5eaf2;border-radius:13px;padding:18px}.stat b{font-size:28px;display:block;margin-top:10px}.panel{background:white;border:1px solid #e5eaf2;border-radius:13px;margin-top:18px;overflow:hidden}.panel-head{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid #edf0f5}.panel-head h2{font-size:16px;margin:0}.toolbar{display:flex;gap:9px;align-items:center}.toolbar input,.toolbar select{height:36px;border:1px solid #dce2ec;border-radius:8px;padding:0 9px}.toolbar button{height:36px;border:0;border-radius:8px;background:#2859d7;color:#fff;padding:0 13px;cursor:pointer}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:13px 16px;border-bottom:1px solid #f0f2f6;white-space:nowrap}th{font-size:12px;color:#748197;background:#fafbfc}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:#eef2f8;color:#526178;font-size:12px}.pill.ok{background:#e6f7ed;color:#14743c}.pill.warn{background:#fff4df;color:#a45e00}.empty{padding:40px;text-align:center;color:#8490a2}.toast{position:fixed;right:24px;bottom:24px;background:#1d2b42;color:#fff;padding:13px 17px;border-radius:9px;box-shadow:0 8px 25px #0002}.code-list{display:flex;flex-wrap:wrap;gap:7px;padding:18px}.code{font:13px ui-monospace;background:#f0f4ff;color:#284b9d;padding:7px 9px;border-radius:6px}
</style>
</head>
<body>
<section id="login" class="login"><form id="loginForm" class="login-card"><div class="logo"><span class="logo-mark">A</span>AIGuard</div><h2>管理员登录</h2><p class="muted">登录后管理许可证、激活码和设备。</p><div id="loginError" class="error hidden"></div><label class="field">用户名<input id="username" autocomplete="username" value="admin" required></label><label class="field">密码<input id="password" type="password" autocomplete="current-password" required></label><label class="field">MFA 验证码（已启用时填写）<input id="mfa" inputmode="numeric" maxlength="6"></label><button class="primary">登录后台</button></form></section>
<section id="app" class="shell hidden"><aside class="side"><div class="logo"><span class="logo-mark">A</span>AIGuard</div><button class="nav active" data-view="dashboard">总览</button><button class="nav" data-view="licenses">激活产品</button><button class="nav" data-view="codes">激活码管理</button><button class="nav" data-view="devices">注册设备</button><button class="nav" data-view="online">在线设备</button></aside><main class="main"><header class="topbar"><h1 id="title">运营总览</h1><button id="logout" class="logout">退出登录</button></header><div id="content" class="content"></div></main></section><div id="toast" class="toast hidden"></div>
<script>
const $=id=>document.getElementById(id), api=location.origin;let token=sessionStorage.getItem('aiguard_admin_session'),view='dashboard';
const esc=x=>String(x??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function request(path,opt={}){const r=await fetch(api+path,{...opt,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{}),...(opt.headers||{})}});if(r.status===401||r.status===403){logout();throw Error('登录已过期')}if(!r.ok)throw Error(await r.text());return r.status===204?null:r.json()}
function toast(s){$('toast').textContent=s;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),2600)}
function logout(){token=null;sessionStorage.removeItem('aiguard_admin_session');$('app').classList.add('hidden');$('login').classList.remove('hidden')}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginError').classList.add('hidden');try{const x=await request('/api/v1/admin/auth/login',{method:'POST',body:JSON.stringify({username:$('username').value,password:$('password').value,mfa_code:$('mfa').value||null})});token=x.access_token;sessionStorage.setItem('aiguard_admin_session',token);$('login').classList.add('hidden');$('app').classList.remove('hidden');load(view)}catch(e){$('loginError').textContent=e;$('loginError').classList.remove('hidden')}};
$('logout').onclick=logout;document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));b.classList.add('active');view=b.dataset.view;load(view)});
const table=(headers,rows)=>`<table><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows||'<tr><td colspan="8" class="empty">暂无数据</td></tr>'}</tbody></table>`;
async function load(v){$('title').textContent={dashboard:'运营总览',licenses:'激活产品',codes:'激活码管理',devices:'注册设备',online:'在线设备'}[v];try{if(v==='dashboard')return dashboard();if(v==='licenses')return licenses();if(v==='codes')return codes();return devices(v==='online')}catch(e){$('content').innerHTML=`<div class="panel empty">${esc(e)}</div>`}}
async function dashboard(){const x=await request('/api/v1/admin/dashboard');$('content').innerHTML=`<div class="cards">${[['许可证总数',x.licenses_total],['有效许可证',x.licenses_active],['可用激活码',x.codes_available],['注册设备',x.devices_total],['在线设备',x.devices_active]].map(x=>`<div class="stat"><span class="muted">${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div><div class="panel"><div class="panel-head"><h2>系统状态</h2></div><div style="padding:22px"><span class="pill ok">数据库已连接</span> <span class="pill ok">Redis 会话已启用</span></div></div>`}
async function licenses(){const xs=await request('/api/v1/admin/licenses?limit=100');$('content').innerHTML=`<div class="panel"><div class="panel-head"><h2>激活产品</h2><button class="toolbar button" onclick="load('licenses')">刷新</button></div>${table(['许可证编号','计划','状态','到期时间','离线租约','设备数'],xs.map(x=>`<tr><td>${esc(x.license_no)}</td><td>${esc(x.plan)}</td><td><span class="pill ${x.status==='active'?'ok':'warn'}">${esc(x.status)}</span></td><td>${esc(x.expires_at||'永久')}</td><td>${esc(x.offline_until)}</td><td>${x.device_count}</td></tr>`).join(''))}</div>`}
async function codes(){const x=await request('/api/v1/admin/license-codes?limit=100');$('content').innerHTML=`<div class="panel"><div class="panel-head"><h2>激活码管理</h2><div class="toolbar"><select id="gplan"><option value="trial">trial</option><option value="subscription">subscription</option><option value="perpetual">perpetual</option></select><input id="gdays" type="number" value="30" title="有效天数"><input id="gqty" type="number" value="10" title="数量"><button onclick="generate()">批量生成</button></div></div>${table(['计划','兑换状态','有效期','设备上限','状态','创建时间','操作'],x.map(c=>`<tr><td>${esc(c.plan)}</td><td>${c.redeemed_at?'<span class="pill ok">已使用</span>':'<span class="pill">未使用</span>'}<br><small>${esc(c.redeemed_license_id||'')}</small></td><td>${c.expires_at?esc(c.expires_at):'永久'}<br><small>${c.duration_days} 天</small></td><td>${c.max_devices}</td><td><span class="pill ${c.status==='available'?'ok':c.status==='expired'?'warn':''}">${esc(c.status)}</span></td><td>${esc(c.created_at)}</td><td><button onclick="editCode('${c.id}',${c.duration_days},${c.max_devices},'${c.expires_at||''}')">编辑</button> <button onclick="codeAction('${c.id}','${c.status==='available'?'disable':'enable'}')">${c.status==='available'?'停用':'启用'}</button> <button class="danger" onclick="codeAction('${c.id}','delete')">删除</button></td></tr>`).join(''))}</div><div id="newCodes"></div>`}
async function editCode(id,days,max,expires){const nextDays=prompt('兑换后许可证有效天数',days);if(nextDays===null)return;const nextMax=prompt('设备上限',max);if(nextMax===null)return;const nextExpires=prompt('激活码失效时间，留空表示不修改',expires||'');try{await request('/api/v1/admin/license-codes/'+id,{method:'PATCH',body:JSON.stringify({duration_days:+nextDays,max_devices:+nextMax,...(nextExpires?{expires_at:new Date(nextExpires).toISOString()}:{})})});toast('激活码已更新');load('codes')}catch(e){toast(e)}}
async function codeAction(id,action){if(action==='delete'&&!confirm('删除后不可恢复，继续？'))return;try{await request('/api/v1/admin/license-codes/'+id+(action==='enable'?'/enable':action==='disable'?'/disable':''),{method:action==='delete'?'DELETE':'POST'});toast('操作成功');load('codes')}catch(e){toast(e)}}async function generate(){try{const x=await request('/api/v1/admin/license-codes',{method:'POST',body:JSON.stringify({plan:$('gplan').value,duration_days:+$('gdays').value,max_devices:1,quantity:+$('gqty').value})});$('newCodes').innerHTML='<div class="code-list">'+x.codes.map(c=>`<span class="code">${c}</span>`).join('')+'</div>';toast('激活码已生成，请立即保存明文')}catch(e){toast(e)}}
async function devices(online){const xs=await request('/api/v1/admin/devices?limit=100');const ys=online?xs.filter(x=>x.status==='active'):xs;$('content').innerHTML=`<div class="panel"><div class="panel-head"><h2>${online?'在线设备':'注册设备'}</h2><button onclick="load('${online?'online':'devices'} )">刷新</button></div>${table(['许可证','平台','设备指纹','状态','首次激活','最后在线'],ys.map(x=>`<tr><td>${esc(x.license_no)}</td><td>${esc(x.platform)}</td><td title="${esc(x.device_public_key)}">${esc(x.device_fingerprint.slice(0,16))}…</td><td><span class="pill ${x.status==='active'?'ok':'warn'}">${esc(x.status)}</span></td><td>${esc(x.first_activated_at)}</td><td>${esc(x.last_seen_at)}</td></tr>`).join(''))}</div>`}
if(token){$('login').classList.add('hidden');$('app').classList.remove('hidden');load(view)}
</script></body></html>
